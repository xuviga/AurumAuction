      <stop offset="0" stop-color="#16202f"/><stop offset="1" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7cf6a"/><stop offset="1" stop-color="#d6931d"/>
