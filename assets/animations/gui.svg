  <style>
    .lot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
    .tip { opacity: 0; transform-box: fill-box; transform-origin: top left; animation: tip 9s ease infinite; }
    @keyframes tip { 0%,28% { opacity: 0; transform: translateY(8px) scale(.96); } 34%,88% { opacity: 1; transform: translateY(0) scale(1); } 96%,100% { opacity: 0; transform: translateY(8px) scale(.96); } }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .sort { animation: sort 9s ease infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sort { 0%,55% { filter: none; } 62%,72% { filter: drop-shadow(0 0 10px #f2b632); transform: scale(1.08); } 80%,100% { transform: scale(1); } }
    .cursor { animation: cursor 9s ease-in-out infinite; }
    @keyframes cursor { 0%,20% { transform: translate(0,0); opacity: 0; } 24% { opacity: 1; } 38%,48% { transform: translate(-650px,-440px); } 55%,60% { transform: translate(-634px,-424px); } 66%,100% { transform: translate(-650px,-440px); opacity: 1; } }
    .ripple { animation: ripple 9s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { 0%,46% { opacity: 0; transform: scale(.2); } 50% { opacity: .8; transform: scale(.5); } 60%,100% { opacity: 0; transform: scale(1.6); } }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .15; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise, .row, .lot, .tip, .toast, .win, .balance, .btn, .bar, .cube, .gavel, .cursor { opacity: 1 !important; transform: none !important; }
      [style*="animation-delay"] { opacity: 1 !important; }
    }
  </style>

