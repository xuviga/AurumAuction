<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">История сделок и топ продавцов</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16202f"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7cf6a"/><stop offset="1" stop-color="#d6931d"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cf0b0"/><stop offset="1" stop-color="#1e9e63"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ec2ff"/><stop offset="1" stop-color="#2f6fc4"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2b632" stop-opacity=".26"/><stop offset="1" stop-color="#f2b632" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .row { opacity: 0; animation: row .55s cubic-bezier(.2,.85,.3,1) both; }
    @keyframes row { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 1.1s cubic-bezier(.2,.8,.25,1) both; }
    @keyframes bar { from { transform: scaleX(0); opacity: .2; } to { transform: scaleX(1); opacity: 1; } }
    .chip { animation: chip 7s ease-in-out infinite; }
    @keyframes chip { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .crown { animation: crown 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes crown { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.9); } 50% { opacity: .8; transform: scale(1.1); } }
    .tick { animation: tick 4s ease-in-out infinite; }
    @keyframes tick { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="230" fill="#f2b632" opacity=".05"/>
  <circle cx="120" cy="660" r="250" fill="#58e296" opacity=".05"/>

