      <circle cx="120" cy="304" r="10" fill="#7cf0b0"/><circle cx="117" cy="301" r="3" fill="#d8fff0" opacity=".85"/>
      <text x="152" y="300" font-size="15" font-weight="600" fill="#e8eef8">Emerald ×16</text>
      <text x="152" y="320" font-size="12" fill="#5f7188">купил у LunaBuilds · 1 ч назад</text>
