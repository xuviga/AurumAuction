  <text x="572" y="560" text-anchor="end" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#8fa2bb">2 410 ₽</text>

  <text x="92" y="612" font-family="Segoe UI, Arial" font-size="12" fill="#5f7188">/ah history · /ah history sold · /ah history bought</text>
