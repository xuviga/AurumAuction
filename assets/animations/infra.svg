<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">AurumAuction: один аукцион на всю сеть серверов</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16202f"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7cf6a"/><stop offset="1" stop-color="#d6931d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182334"/><stop offset="1" stop-color="#111a27"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="hubGlow" cx="50%" cy="46%" r="62%"><stop offset="0" stop-color="#f2b632" stop-opacity=".12"/><stop offset="1" stop-color="#f2b632" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3c5a7f"/>
    </marker>
  </defs>
  <style>
    .dash { stroke-dasharray: 7 9; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .pkt { animation: pkt 3.4s ease-in-out infinite; }
    @keyframes pkt { 0%,100% { opacity: .15; } 45%,60% { opacity: 1; } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.25,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .halo { animation: halo 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { opacity: .10; transform: scale(.94); } 50% { opacity: .26; transform: scale(1.06); } }
    .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { animation: dot 2.4s ease-in-out infinite; }
    @keyframes dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="220" fill="#5aa9ff" opacity=".045"/>
  <circle cx="1120" cy="640" r="260" fill="#58e296" opacity=".05"/>

  <g class="rise">
    <text x="70" y="74" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#e8eef8">Один аукцион <tspan fill="#f2b632">на всю сеть</tspan></text>
    <text x="70" y="106" font-family="Segoe UI, Arial" font-size="16" fill="#8fa2bb">Общая база лотов, атомарные сделки и синхронизация между серверами</text>
  </g>

  <!-- connections -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path id="c1" d="M370 212 C450 212 500 300 560 340" stroke="#2f6fc4" stroke-opacity=".35"/>
    <path id="c2" d="M370 350 C440 350 500 350 560 356" stroke="#f2b632" stroke-opacity=".35"/>
    <path id="c3" d="M370 488 C450 488 500 410 560 372" stroke="#58e296" stroke-opacity=".35"/>
    <path id="c4" d="M722 340 C790 300 830 280 890 274" stroke="#f2b632" stroke-opacity=".35"/>
    <path id="c5" d="M722 380 C790 420 830 448 890 456" stroke="#5aa9ff" stroke-opacity=".35"/>

    <use class="dash" href="#c1" stroke="#5aa9ff" stroke-width="2"/>
    <use class="dash" href="#c2" stroke="#f2b632" stroke-width="2"/>
    <use class="dash" href="#c3" stroke="#58e296" stroke-width="2"/>
    <use class="dash" href="#c4" stroke="#f2b632" stroke-width="2" style="animation-direction:reverse"/>
    <use class="dash" href="#c5" stroke="#5aa9ff" stroke-width="2" style="animation-direction:reverse"/>
  </g>

  <!-- packets -->
  <g>
    <circle r="4.5" fill="#7ec2ff" filter="url(#glow)"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="4.5" fill="#f7cf6a" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.9s"><mpath href="#c2"/></animateMotion></circle>
    <circle r="4.5" fill="#7cf0b0" filter="url(#glow)"><animateMotion dur="3.1s" repeatCount="indefinite" begin="1.6s"><mpath href="#c3"/></animateMotion></circle>
    <circle r="4" fill="#f7cf6a" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#c4"/></animateMotion></circle>
    <circle r="4" fill="#7ec2ff" filter="url(#glow)"><animateMotion dur="2.9s" repeatCount="indefinite" begin="1.2s"><mpath href="#c5"/></animateMotion></circle>
  </g>

  <!-- servers -->
  <g font-family="Segoe UI, Arial">
    <g class="rise" style="animation-delay:.12s">
      <rect x="70" y="152" width="300" height="118" rx="16" fill="url(#card)" stroke="#2b3d55" stroke-width="1.5"/>
      <rect x="90" y="174" width="46" height="46" rx="10" fill="#0f1824" stroke="#2f6fc4"/>
      <path d="M104 206 h18 M104 198 h18 M104 190 h18" stroke="#7ec2ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="152" y="192" font-size="17" font-weight="700" fill="#e8eef8">Paper / Purpur</text>
      <text x="152" y="214" font-size="13" fill="#8fa2bb">1.16.5 – 26.x · Java 8+</text>
      <g class="dot"><circle cx="348" cy="172" r="5" fill="#58e296"/></g>
    </g>

    <g class="rise" style="animation-delay:.26s">
      <rect x="70" y="290" width="300" height="118" rx="16" fill="url(#card)" stroke="#2b3d55" stroke-width="1.5"/>
      <rect x="90" y="312" width="46" height="46" rx="10" fill="#0f1824" stroke="#f2b632"/>
      <path d="M104 344 h18 M104 336 h18 M104 328 h18" stroke="#f2b632" stroke-width="2.5" stroke-linecap="round"/>
      <text x="152" y="330" font-size="17" font-weight="700" fill="#e8eef8">Folia</text>
      <text x="152" y="352" font-size="13" fill="#8fa2bb">region-планировщик · 1.19.4+</text>
      <g class="dot"><circle cx="348" cy="310" r="5" fill="#58e296"/></g>
    </g>

    <g class="rise" style="animation-delay:.40s">
      <rect x="70" y="428" width="300" height="118" rx="16" fill="url(#card)" stroke="#2b3d55" stroke-width="1.5"/>
      <rect x="90" y="450" width="46" height="46" rx="10" fill="#0f1824" stroke="#58e296"/>
      <path d="M102 472 h22 v16 h-22 z M106 468 h14" stroke="#7cf0b0" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <text x="152" y="468" font-size="17" font-weight="700" fill="#e8eef8">Geyser / Bedrock</text>
      <text x="152" y="490" font-size="13" fill="#8fa2bb">компактные подсказки в лоре</text>
      <g class="dot"><circle cx="348" cy="448" r="5" fill="#58e296"/></g>
    </g>
  </g>

  <circle class="halo" cx="648" cy="356" r="92" fill="#f2b632" filter="url(#glow)"/>
  <circle class="spin" cx="648" cy="358" r="146" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="2 16" opacity=".38"/>
  <!-- hub -->
  <g filter="url(#shadow)">
    <rect x="546" y="256" width="204" height="204" rx="34" fill="#0d1521" stroke="url(#gold)" stroke-width="3"/>
    <rect x="558" y="268" width="180" height="180" rx="26" fill="none" stroke="#f2b632" stroke-opacity=".18" stroke-width="1.5"/>
  </g>
  <rect x="558" y="268" width="180" height="180" rx="26" fill="url(#hubGlow)"/>
  <g transform="translate(584 296)">
    <path d="M32 44 L64 30 L96 44 L64 58 Z" fill="#58e296"/>
    <path d="M32 44 L64 58 L64 94 L32 80 Z" fill="#1e9e63"/>
    <path d="M96 44 L64 58 L64 94 L96 80 Z" fill="#157a4f"/>
    <path d="M32 44 L64 30 L96 44 L64 58 Z" fill="none" stroke="#f2b632" stroke-width="2.4"/>
    <path d="M32 44 L64 58 L64 94 L32 80 Z" fill="none" stroke="#f2b632" stroke-width="2.4"/>
    <path d="M96 44 L64 58 L64 94 L96 80 Z" fill="none" stroke="#f2b632" stroke-width="2.4"/>
  </g>
  <text x="648" y="416" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#f2b632">AurumAuction</text>
  <text x="648" y="436" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#8fa2bb">снежинка ID · transition</text>

  <!-- right cards -->
  <g font-family="Segoe UI, Arial">
    <g class="rise" style="animation-delay:.34s">
      <rect x="890" y="196" width="320" height="140" rx="16" fill="url(#card)" stroke="#2b3d55" stroke-width="1.5"/>
      <text x="914" y="228" font-size="15" font-weight="700" fill="#f2b632">Хранилище</text>
      <g font-size="13" fill="#8fa2bb">
        <text x="914" y="258">SQLite — «из коробки»</text>
        <text x="914" y="282">MySQL / MariaDB — сеть</text>
        <text x="914" y="306">миграция lots.yml → SQL</text>
      </g>
      <g class="dot"><circle cx="1182" cy="214" r="5" fill="#f2b632"/></g>
    </g>

    <g class="rise" style="animation-delay:.48s">
      <rect x="890" y="356" width="320" height="176" rx="16" fill="url(#card)" stroke="#2b3d55" stroke-width="1.5"/>
      <text x="914" y="388" font-size="15" font-weight="700" fill="#7ec2ff">Данные игрока</text>
      <g font-size="13" fill="#8fa2bb">
        <text x="914" y="416">история покупок и продаж</text>
        <text x="914" y="440">топ продавцов</text>
        <text x="914" y="464">watchlist и уведомления</text>
        <text x="914" y="488">клеймы и выплаты</text>
        <text x="914" y="512" fill="#5f7188">локально на каждом сервере</text>
      </g>
    </g>
  </g>

  <!-- bottom features -->
  <g class="rise" style="animation-delay:.62s">
    <rect x="70" y="590" width="1140" height="76" rx="16" fill="#0c141e" stroke="#2b3d55"/>
    <g font-family="Segoe UI, Arial" font-size="13" font-weight="600">
      <g transform="translate(94 612)">
        <circle cx="8" cy="8" r="8" fill="#58e296" fill-opacity=".16"/><path d="M4 8 L7 11 L12 5" stroke="#7cf0b0" stroke-width="2" fill="none"/>
        <text x="26" y="13" fill="#c8d2e2">Атомарные сделки</text>
      </g>
      <g transform="translate(300 612)">
        <circle cx="8" cy="8" r="8" fill="#f2b632" fill-opacity=".16"/><circle cx="8" cy="8" r="3" fill="#f2b632"/>
        <text x="26" y="13" fill="#c8d2e2">Эскроу ставок</text>
      </g>
      <g transform="translate(486 612)">
        <circle cx="8" cy="8" r="8" fill="#5aa9ff" fill-opacity=".16"/><path d="M4 9 h8 M8 5 v8" stroke="#7ec2ff" stroke-width="2"/>
        <text x="26" y="13" fill="#c8d2e2">Клеймы офлайн</text>
      </g>
      <g transform="translate(680 612)">
        <circle cx="8" cy="8" r="8" fill="#58e296" fill-opacity=".16"/><rect x="4" y="4" width="8" height="8" rx="2" fill="#7cf0b0"/>
        <text x="26" y="13" fill="#c8d2e2">Bedrock-режим</text>
      </g>
      <g transform="translate(872 612)">
        <circle cx="8" cy="8" r="8" fill="#f2b632" fill-opacity=".16"/><path d="M4 8 h8 M8 4 v8" stroke="#f2b632" stroke-width="2"/>
        <text x="26" y="13" fill="#c8d2e2">Vault опционально</text>
      </g>
      <g transform="translate(1076 612)">
        <circle cx="8" cy="8" r="8" fill="#5aa9ff" fill-opacity=".16"/><path d="M4 6 h8 M4 10 h8" stroke="#7ec2ff" stroke-width="2"/>
        <text x="26" y="13" fill="#c8d2e2">Folia-ready</text>
      </g>
    </g>
    <text x="94" y="648" font-family="Segoe UI, Arial" font-size="12" fill="#5f7188">Без обязательных зависимостей · один jar · конфиги на русском и английском</text>
  </g>

  <!-- moving ring around hub -->
</svg>
